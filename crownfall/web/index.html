<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172c28"><meta name="description" content="Crownfall – Rise of Realms, ein eigenständiges Aufbaustrategiespiel"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><link rel="stylesheet" href="style.css"><title>Crownfall · Rise of Realms</title></head><body>
<header><div class="brand"><span class="crest">♛</span><div><strong>CROWNFALL</strong><small>RISE OF REALMS · ALPHA 0.1</small></div></div><div id="resources" aria-live="off"></div><button id="pause" aria-label="Spiel pausieren">Ⅱ</button></header>
<main><section class="world"><canvas id="map" aria-label="Isometrische Siedlungskarte" tabindex="0"></canvas><div class="maplabel"><b id="realm">Sylvaris</b><small>WALDLANDE · ZEITALTER I</small></div><div class="maptools"><button id="zoomIn" aria-label="Vergrössern">+</button><button id="zoomOut" aria-label="Verkleinern">−</button><button id="center" aria-label="Karte zentrieren">◎</button></div><div id="notice" role="status">Wähle einen Bauauftrag oder ein Gebäude.</div></section>

<dialog id="found"><form method="dialog" id="foundForm"><div class="crest big">♛</div><small>ERYNDOR · SYLVARIS</small><h1>Dein Banner erhebt sich.</h1><p>Aus acht Bewohnern wächst ein Reich. Sichere Nahrung, Holz und Wasser und verteidige deine Siedlung.</p><label>Reichsname<input id="name" minlength="3" maxlength="24" required value="Neues Banner"></label><label>Kriegsherr<select id="hero"><option>Aldric Valen</option><option>Elara Voss</option></select></label><button class="gold" type="submit">Reich gründen</button><button id="cancelFound" type="button" hidden>Abbrechen</button></form></dialog>
<script type="module" src="app.mjs"></script></body></html>
