name: HomeCraft signed release APK
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: homecraft-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: homecraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: homecraft-gradle-${{ runner.os }}-${{ hashFiles('homecraft/package.json') }}
          restore-keys: homecraft-gradle-${{ runner.os }}-
      - name: Verify Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK"
          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -d "$SDK/build-tools/35.0.0" ]]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - run: npx cap add android
      - run: npx cap sync android
      - run: python3 scripts/icons.py android
      - run: python3 scripts/install-native.py
      - run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
        working-directory: homecraft/android
      - name: Sign and verify APK
        env:
          KEYSTORE_B64: ${{ secrets.HOMECRAFT_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.HOMECRAFT_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.HOMECRAFT_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HOMECRAFT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD"
          umask 077
          ks="$(mktemp)"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$ks"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          "$tools/zipalign" -f -p 4 android/app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$tools/apksigner" sign --ks "$ks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD --out HomeCraft-3D-release.apk aligned.apk
          "$tools/apksigner" verify --verbose HomeCraft-3D-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HomeCraft-3D-signed-release
          path: homecraft/HomeCraft-3D-release.apk
          if-no-files-found: error
