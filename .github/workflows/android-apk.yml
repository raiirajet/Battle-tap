name: Build Android APK (development)

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Android and iOS platform scaffolding
        run: flutter create --platforms=android,ios --project-name battle_tap --org ch.battletap .
      - name: Resolve packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: battle-tap-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
