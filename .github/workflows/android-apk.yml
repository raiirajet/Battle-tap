name: Build Android APK (development)

on:
  workflow_dispatch:
  push:
    branches: [main, 'feature/**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate native Android and iOS platform scaffolding
        run: flutter create --platforms=android,ios --project-name battle_tap --org ch.battletap .
      - name: Configure Android permissions
        run: python3 scripts/configure_android_permissions.py
      - name: Resolve packages
        run: flutter pub get
      - name: Generate BattleTap launcher icons
        run: dart run flutter_launcher_icons
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit tests
        run: flutter test
      - name: Build debug APK
        run: |
          firebase_options=()
          if [[ -f firebase/android.json ]]; then
            firebase_options+=(--dart-define-from-file=firebase/android.json)
          fi
          flutter build apk --debug "${firebase_options[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: battle-tap-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
