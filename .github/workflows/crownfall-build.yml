name: Crownfall standalone builds
on:
  push:
    branches: ['crownfall-v0.1', main]
    paths: ['crownfall/**', '.github/workflows/crownfall-build.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulation tests
        run: |
          node --test crownfall/tests/*.test.mjs
          node --check crownfall/web/app.mjs
          node --check crownfall/web/sw.js
          for f in crownfall/web/*.mjs; do node --check "$f"; done
      - name: Download verified 3D assets v0.3
        uses: actions/download-artifact@v4
        with:
          name: Crownfall_3D_Assets_v0.3
          run-id: 45841769836
          github-token: ${{ github.token }}
          path: crownfall/web/assets3d
      - name: Verify packaged models and bundle renderer
        run: |
          node crownfall/tools/asset3d/validate.mjs crownfall/web/assets3d
          npm install --prefix crownfall/tools/renderer --no-audit --no-fund
          crownfall/tools/renderer/node_modules/.bin/esbuild crownfall/tools/renderer/scene.mjs --bundle --format=esm --minify --target=es2020 --outfile=crownfall/web/renderer.bundle.mjs
      - name: Browser 3D smoke test
        run: |
          crownfall/tools/renderer/node_modules/.bin/playwright install chromium
          node crownfall/tools/renderer/smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: crownfall-3d-smoke-screenshot
          path: crownfall-3d-smoke.png
      - name: Generate PWA icons
        run: python3 crownfall/tools/icons.py crownfall/web
      - uses: actions/upload-artifact@v4
        with:
          name: crownfall-pwa
          path: crownfall/web/
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK"
          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -d "$SDK/build-tools/35.0.0" ]]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
          test -f "$SDK/platforms/android-35/android.jar"
      - name: Build standalone Android APK
        run: gradle -p crownfall/android assembleDebug
      - name: Verify APK contains engine and assets
        run: |
          APK=crownfall/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -tq "$APK"
          python3 -c "import zipfile; z=zipfile.ZipFile('$APK'); n=z.namelist(); assert 'assets/renderer.bundle.mjs' in n; assert 'assets/assets3d/manifest.json' in n; assert sum(x.endswith('.glb') for x in n)==691; print('APK includes all 691 GLBs')"
      - uses: actions/upload-artifact@v4
        with:
          name: crownfall-debug-apk
          path: crownfall/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
