name: Crownfall standalone builds
on:
  push:
    branches: ['crownfall-v0.1', main]
    paths: ['crownfall/**', '.github/workflows/crownfall-build.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Simulation tests
        run: |
          node --test crownfall/tests/*.test.mjs
          node --check crownfall/web/app.mjs
          node --check crownfall/web/sw.js
      - name: Generate PWA icons
        run: python3 crownfall/tools/icons.py crownfall/web
      - uses: actions/upload-artifact@v4
        with:
          name: crownfall-pwa
          path: crownfall/web/
          if-no-files-found: error
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build standalone Android APK
        run: gradle -p crownfall/android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: crownfall-debug-apk
          path: crownfall/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
