name: HomeCraft 3D Android and PWA
on:
  push:
    branches: [homecraft-3d, main]
    paths: ['homecraft/**', '.github/workflows/homecraft-android.yml']
  workflow_dispatch:
concurrency:
  group: homecraft-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: homecraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: homecraft-gradle-${{ runner.os }}-${{ hashFiles('homecraft/package.json') }}
          restore-keys: homecraft-gradle-${{ runner.os }}-
      - name: Verify Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK"
          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -d "$SDK/build-tools/35.0.0" ]]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Browser 2D and WebGL smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run preview -- --port 4173 > /tmp/homecraft-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/browser-smoke.mjs
          node scripts/release-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: HomeCraft-smoke-screenshot
          path: homecraft/homecraft-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: HomeCraft-PWA
          path: homecraft/dist
      - run: npx cap add android
      - run: npx cap sync android
      - run: python3 scripts/icons.py android
      - run: python3 scripts/install-native.py
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: homecraft/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk HomeCraft-3D-debug.apk
      - name: Verify packaged planner assets
        run: |
          unzip -tq HomeCraft-3D-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose HomeCraft-3D-debug.apk
          sha256sum HomeCraft-3D-debug.apk > HomeCraft-3D-debug.apk.sha256
          python3 -c "import zipfile; z=zipfile.ZipFile('HomeCraft-3D-debug.apk'); n=z.namelist(); assert 'assets/public/index.html' in n; assert any(x.startswith('assets/public/assets/') and x.endswith('.js') for x in n); print('HomeCraft web engine packaged')"
      - uses: actions/upload-artifact@v4
        with:
          name: HomeCraft-3D-APK
          path: |
            homecraft/HomeCraft-3D-debug.apk
            homecraft/HomeCraft-3D-debug.apk.sha256
          if-no-files-found: error
