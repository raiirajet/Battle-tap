name: HomeCraft 3D Android and PWA
on:
  push:
    branches: [homecraft-3d, main]
    paths: ['homecraft/**', '.github/workflows/homecraft-android.yml']
  pull_request:
    paths: ['homecraft/**', '.github/workflows/homecraft-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homecraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify Android SDK
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK"
          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -d "$SDK/build-tools/35.0.0" ]]; then
            "$SDK/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
          fi
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Browser 2D and WebGL smoke test
        run: |
          npx playwright install --with-deps chromium
          npm run preview -- --port 4173 > /tmp/homecraft-preview.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4173/ >/dev/null && break; sleep 1; done
          node scripts/browser-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: HomeCraft-smoke-screenshot
          path: homecraft/homecraft-smoke.png
      - uses: actions/upload-artifact@v4
        with:
          name: HomeCraft-PWA
          path: homecraft/dist
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: homecraft/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk HomeCraft-3D-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HomeCraft-3D-APK
          path: homecraft/HomeCraft-3D-debug.apk
          if-no-files-found: error
