name: HomeCraft 3D Android and PWA
on:
  push:
    branches: [homecraft-3d, main]
    paths: ['homecraft/**', '.github/workflows/homecraft-android.yml']
  pull_request:
    paths: ['homecraft/**', '.github/workflows/homecraft-android.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: homecraft
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: HomeCraft-PWA
          path: homecraft/dist
      - run: npx cap add android
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: homecraft/android
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk HomeCraft-3D-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: HomeCraft-3D-APK
          path: homecraft/HomeCraft-3D-debug.apk
          if-no-files-found: error
