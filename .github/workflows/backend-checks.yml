name: Backend static checks
on:
  workflow_dispatch:
  push:
    paths: ['functions/**', 'firebase.json', 'firestore.rules', 'firestore.indexes.json']
  pull_request:
    paths: ['functions/**', 'firebase.json', 'firestore.rules', 'firestore.indexes.json']
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
        working-directory: functions
      - run: npm run lint
        working-directory: functions
      - run: npm test
        working-directory: functions
